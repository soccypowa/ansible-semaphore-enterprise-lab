---
admin_users_sudo_group: wheel
webserver_docroot: /usr/share/nginx/html
webserver_firewall_backend: firewalld
sshd_sftp_subsystem: /usr/lib/openssh/sftp-server
postgres_packages:
  - postgresql{{ postgres_version }}-server
  - postgresql{{ postgres_version }}-contrib
  - python3-psycopg2
postgres_service: postgresql-{{ postgres_version }}
postgres_language_pack: glibc-langpack-en
postgres_config_dir: /var/lib/pgsql/{{ postgres_version }}/data
postgres_conf_file: "{{ postgres_config_dir }}/postgresql.conf"
postgres_hba_file: "{{ postgres_config_dir }}/pg_hba.conf"
postgres_pgdg_repo_url: >-
  https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm

rhsm_auth_method: activation_key
rhsm_org_id: "{{ vault_rhsm_org_id }}"
rhsm_activation_key: "{{ vault_rhsm_activation_key }}"

# Example: enable the standard RHEL 9 base and appstream repos
rhsm_repositories:
  - rhel-10-for-x86_64-baseos-rpms
  - rhel-10-for-x86_64-appstream-rpms
