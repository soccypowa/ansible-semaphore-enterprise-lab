---
# Static inventory for the lab. Grouping by distro family lets us attach
# per-OS variables (sudo group name, web root path, firewall backend) via
# group_vars/<groupname>.yml, instead of branching with `when:` everywhere
# in the roles.
#
# "webservers" deliberately re-uses the same three hosts as a second,
# function-based group. A host can belong to as many groups as you like;
# this is what lets you run the webserver playbook against everything
# (--limit webservers, the default), or a subset (--limit ubuntu,
# --limit opensuse, or --limit ubuntu-node for a single host).

all:
  vars:
    ansible_user: ansible_svc
  children:
    managed_nodes:
      children:
        ubuntu:
          hosts:
            ubuntu-node:
              ansible_host: 192.168.0.54
        opensuse:
          hosts:
            opensuse-node:
              ansible_host: 192.168.0.55
        redhat:
          hosts:
            redhat-node:
              ansible_host: 192.168.0.12

    webservers:
      children:
        ubuntu:
        opensuse:
        redhat:

    # New: database servers, split by system so you can target them
    # independently in Semaphore ("--limit db_hr" vs "--limit db_finance")
    db_servers:
      children:
        db_hr:
          hosts:
            ubuntu-node:
        db_finance:
          hosts:
            redhat-node:
