[defaults]
inventory             = inventory/production/hosts.yml
roles_path            = roles
remote_user           = ansible_svc
host_key_checking     = True
retry_files_enabled   = False
interpreter_python    = auto_silent
result_format         = yaml
deprecation_warnings  = False
forks                 = 10
timeout               = 30

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
pipelining        = True
control_path_dir  = ~/.ansible/cp
# A repo-tracked known_hosts file lets host_key_checking stay enabled even
# when Semaphore runs non-interactively (no TTY to answer "yes" prompts).
# See README.md "SSH host keys" for how to populate ./.known_hosts safely.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=./.known_hosts
