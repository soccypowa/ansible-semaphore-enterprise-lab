---
# Targets db_servers, which currently contains ubuntu-node (HR) and
# redhat-node (Finance). Each host's specific databases and users come
# from host_vars -- the role itself doesn't know or care which system
# it's serving.
#
# To target just one system:
#   ansible-playbook playbooks/postgres.yml --limit db_hr
#   ansible-playbook playbooks/postgres.yml --limit db_finance

- name: Configure PostgreSQL database servers
  hosts: db_servers
  become: true
  roles:
    - role: postgres
