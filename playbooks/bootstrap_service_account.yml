---
# Run this playbook exactly once per managed host, authenticating with
# whatever initial access you currently have (a cloud-init default user
# with sudo, or root over the console/initial password). It creates the
# dedicated, non-interactive service account that Semaphore will use for
# every subsequent run, and locks that account's sudo to NOPASSWD because
# it is never used by a human.
#
# Example invocation:
#
#   ansible-playbook -i inventory/production/hosts.yml \
#     -u root -k \
#     -e "semaphore_pubkey=$(cat semaphore_automation_key.pub)" \
#     playbooks/bootstrap_service_account.yml
#
# After this succeeds on all three hosts:
#   1. Load the matching PRIVATE key into Semaphore's Key Store (never onto
#      disk on the control node -- Semaphore stores it encrypted in its DB).
#   2. Confirm Semaphore can reach each host as ansible_svc.
#   3. Rotate/retire whatever credential you bootstrapped with (disable the
#      cloud-init user, rotate the root password, revoke the temporary key,
#      per your platform's standard).
#
# This playbook intentionally lives outside playbooks/site.yml -- it is a
# one-time, higher-privilege operation and should not be casually re-run or
# scheduled.

- name: Bootstrap the dedicated Ansible/Semaphore service account
  hosts: managed_nodes
  become: true
  gather_facts: true
  vars:
    service_account: ansible_svc
    ansible_user: "{{ bootstrap_user | default(lookup('env', 'USER')) }}"
  tasks:
    - name: Fail fast if no public key was supplied
      ansible.builtin.assert:
        that:
          - semaphore_pubkey is defined
          - semaphore_pubkey | length > 0
        fail_msg: >-
          Pass -e "semaphore_pubkey=<contents of the .pub file>" -- see the
          comment at the top of this playbook for the full command.

    - name: Ensure the privilege-escalation group exists
      ansible.builtin.group:
        name: "{{ admin_users_sudo_group }}"
        state: present

    - name: Create the dedicated automation service account
      ansible.builtin.user:
        name: "{{ service_account }}"
        comment: "Ansible/Semaphore automation account -- managed by bootstrap_service_account.yml, do not use interactively"
        groups: "{{ admin_users_sudo_group }}"
        append: true
        shell: /bin/bash
        create_home: true
        password: "!"

    - name: Authorize the Semaphore automation public key
      ansible.posix.authorized_key:
        user: "{{ service_account }}"
        state: present
        exclusive: true
        key: "{{ semaphore_pubkey }}"

    - name: Grant the service account passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/99-{{ service_account }}"
        owner: root
        group: root
        mode: "0440"
        content: |
          # Managed by bootstrap_service_account.yml -- do not edit by hand.
          #
          # NOPASSWD is the pragmatic trade-off here, not an oversight:
          # Ansible modules can run arbitrary commands under the hood, so
          # trying to whitelist individual commands in sudoers gives a false
          # sense of safety while breaking modules in subtle ways. The
          # control that actually matters is that this account is used by
          # nothing except Semaphore, its private key only ever lives inside
          # Semaphore's encrypted key store, and every run is logged in
          # Semaphore's task history for audit.
          {{ service_account }} ALL=(ALL:ALL) NOPASSWD: ALL
        validate: "visudo -cf %s"
