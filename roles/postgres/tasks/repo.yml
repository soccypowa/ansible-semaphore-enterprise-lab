---
# Ubuntu/Debian -- add the PGDG apt repository
- name: Install prereqs for apt over HTTPS (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - apt-transport-https
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create apt keyrings directory (Debian/Ubuntu)
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == "Debian"

- name: Download PGDG signing key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: "{{ postgres_pgdg_key_url }}"
    dest: /tmp/pgdg.asc
    mode: "0644"
    force: true
  when: ansible_os_family == "Debian"

- name: Dearmor and install PGDG signing key (Debian/Ubuntu)
  ansible.builtin.shell:
    cmd: gpg --dearmor < /tmp/pgdg.asc > /usr/share/keyrings/pgdg.gpg
    creates: /usr/share/keyrings/pgdg.gpg
  when: ansible_os_family == "Debian"

- name: Clean up temporary key file (Debian/Ubuntu)
  ansible.builtin.file:
    path: /tmp/pgdg.asc
    state: absent
  when: ansible_os_family == "Debian"

- name: Add PGDG apt repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/pgdg.gpg]
      {{ postgres_pgdg_repo_url }}
      {{ ansible_distribution_release }}-pgdg main
    filename: pgdg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# RHEL -- add the PGDG rpm repository
- name: Disable builtin postgresql module (RHEL 8/9)
  ansible.builtin.command:
    cmd: dnf module disable postgresql -y
  changed_when: false
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int <= 9

- name: Install PGDG rpository (RHEL)
  ansible.builtin.dnf:
    name: "{{ postgres_pgdg_repo_url }}"
    state: present
    disable_gpg_check: false
  when: ansible_os_family == "RedHat"

# openSUSE -- add the PGDG zypper repository
- name: Add PGDG repository (OpenSuse)
  community.general.zypper_repository:
    name: pgdg
    repo: "{{ postgres_pgdg_repo_url }}"
    state: present
    auto_import_keys: true
  when: ansible_os_family == "Suse"
